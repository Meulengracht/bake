project:
  name: lcow-uvm
  summary: LCOW runtime base
  description: |
    Builds a self-contained LCOW runtime base package for Windows-hosted Linux
    containers. The pack contains:
    - a Linux guest rootfs under `rootfs/`
    - an LCOW UVM bundle at the package root (`uvm.vhdx` + optional kernel/initrd/boot params)

    This layout lets served/cvd resolve both the guest rootfs and the HvRuntime
    UVM settings from a single base package.
  author: Philip Meulengracht
  email: the_meulengracht@hotmail.com
  version: 1.0.0
  license: MIT

environment:
  host:
    packages:
      - ca-certificates
      - git
      - linuxkit
      - tar
      - wget

recipes:
  - name: uvm
    source:
      type: path
      path: ./
      script: |
        if build.subsystem.platform_host() == "linux" then
          args = build.paths.install()
          args = args .. " " .. build.subsystem.arch_target()
          build.shell("construct.sh", args)
          build.shell("construct-lcow-uvm.sh", args)
        end

packs:
- name: lcow-uvm
  type: os
