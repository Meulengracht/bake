name: LCOW UVM Archive

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: LCOW UVM architecture
        required: true
        default: amd64
      base_archive_url:
        description: URL for the base rootfs archive consumed by mkuvm construct
        required: true
      kernel_url:
        description: URL for the explicit kernel or vmlinux consumed by mkuvm construct
        required: true
      delta_archive_url:
        description: Optional URL for an overlay archive merged into the initrd before normalization
        required: false
        default: ""

jobs:
  build-lcow-uvm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ubuntu build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libfuse3-dev \
          libcap-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libseccomp-dev \
          libbpf-dev \
          cpio \
          git \
          curl \
          tar \
          bash

    - name: Configure CMake
      run: |
        cmake -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"

    - name: Build mkuvm
      run: |
        cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" --target mkuvm

    - name: Resolve mkuvm path
      id: resolve-mkuvm
      run: |
        candidates=(
          "$GITHUB_WORKSPACE/build/bin/mkuvm"
          "$GITHUB_WORKSPACE/build/bin/Release/mkuvm"
          "$GITHUB_WORKSPACE/build/Release/mkuvm"
        )

        mkuvm_path=""
        for candidate in "${candidates[@]}"; do
          if [[ -x "$candidate" ]]; then
            mkuvm_path="$candidate"
            break
          fi
        done

        if [[ -z "$mkuvm_path" ]]; then
          echo 'mkuvm not found in the expected build output locations.' >&2
          exit 1
        fi

        echo "path=$mkuvm_path" >> "$GITHUB_OUTPUT"

    - name: Construct LCOW UVM bundle
      id: construct
      run: |
        output_dir="$RUNNER_TEMP/lcow-uvm"
        archive_path="$RUNNER_TEMP/lcow-uvm-${{ inputs.architecture }}.tar.gz"
        working_dir="$RUNNER_TEMP/lcow-uvm-work"
        inputs_dir="$RUNNER_TEMP/lcow-uvm-inputs"
        base_archive="$inputs_dir/base.tar.gz"
        kernel_path="$inputs_dir/kernel"

        mkdir -p "$inputs_dir"

        curl -L --fail \
          --output "$base_archive" \
          "${{ inputs.base_archive_url }}"

        curl -L --fail \
          --output "$kernel_path" \
          "${{ inputs.kernel_url }}"

        delta_args=()
        if [[ -n "${{ inputs.delta_archive_url }}" ]]; then
          delta_archive="$inputs_dir/delta.tar.gz"
          curl -L --fail \
            --output "$delta_archive" \
            "${{ inputs.delta_archive_url }}"
          delta_args=(--delta-archive "$delta_archive")
        fi

        bash "$GITHUB_WORKSPACE/.github/scripts/construct-lcow-uvm.sh" \
          --mkuvm-path "${{ steps.resolve-mkuvm.outputs.path }}" \
          --output-dir "$output_dir" \
          --archive-path "$archive_path" \
          --base-archive "$base_archive" \
          --kernel-path "$kernel_path" \
          --arch "${{ inputs.architecture }}" \
          "${delta_args[@]}" \
          --working-directory "$working_dir"

    - name: Upload LCOW UVM bundle directory
      uses: actions/upload-artifact@v4
      with:
        name: lcow-uvm-bundle-${{ inputs.architecture }}
        path: ${{ steps.construct.outputs.output_dir }}
        if-no-files-found: error

    - name: Upload LCOW UVM archive
      uses: actions/upload-artifact@v4
      with:
        name: lcow-uvm-archive-${{ inputs.architecture }}
        path: ${{ steps.construct.outputs.archive_path }}
        if-no-files-found: error