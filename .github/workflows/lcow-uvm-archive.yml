name: LCOW UVM Archive

on:
  workflow_dispatch:

jobs:
  produce-upstream-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Pinned artifact references for deterministic, reproducible builds
      LCOW_ARCH: amd64
      LCOW_UBUNTU_VERSION: 24
      LCOW_UBUNTU_RELEASE: 3
      LCOW_KERNEL_IMAGE: linuxkit/kernel:6.12.59-0ef72d722190ecfe0b3b37711f9a871a696e301a
      LCOW_HCSSHIM_REPO: https://github.com/microsoft/hcsshim.git
      LCOW_HCSSHIM_REF: main
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ubuntu build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          gzip \
          curl \
          make

    - name: Produce upstream LCOW inputs
      run: |
        export LCOW_OUTPUT_DIR="$RUNNER_TEMP/lcow-upstream-inputs"
        bash "$GITHUB_WORKSPACE/.github/scripts/produce-lcow-upstream-inputs.sh"

    - name: Upload produced upstream inputs
      uses: actions/upload-artifact@v4
      with:
        name: lcow-upstream-inputs-amd64
        path: ${{ runner.temp }}/lcow-upstream-inputs
        if-no-files-found: error

  build-lcow-uvm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: produce-upstream-inputs
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      LCOW_ARCH: amd64
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ubuntu build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libfuse3-dev \
          libcap-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libseccomp-dev \
          libbpf-dev \
          cpio \
          git \
          curl \
          tar \
          bash

    - name: Download produced upstream inputs
      uses: actions/download-artifact@v4
      with:
        name: lcow-upstream-inputs-amd64
        path: ${{ runner.temp }}/lcow-upstream-inputs

    - name: Configure CMake
      run: |
        cmake -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"

    - name: Build mkuvm
      run: |
        cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" --target mkuvm

    - name: Resolve mkuvm path
      id: resolve-mkuvm
      run: |
        candidates=(
          "$GITHUB_WORKSPACE/build/bin/mkuvm"
          "$GITHUB_WORKSPACE/build/bin/Release/mkuvm"
          "$GITHUB_WORKSPACE/build/Release/mkuvm"
        )

        mkuvm_path=""
        for candidate in "${candidates[@]}"; do
          if [[ -x "$candidate" ]]; then
            mkuvm_path="$candidate"
            break
          fi
        done

        if [[ -z "$mkuvm_path" ]]; then
          echo 'mkuvm not found in the expected build output locations.' >&2
          exit 1
        fi

        echo "path=$mkuvm_path" >> "$GITHUB_OUTPUT"

    - name: Construct LCOW UVM bundle
      id: construct
      run: |
        output_dir="$RUNNER_TEMP/lcow-uvm"
        archive_path="$RUNNER_TEMP/lcow-uvm-$LCOW_ARCH.tar.gz"
        working_dir="$RUNNER_TEMP/lcow-uvm-work"
        inputs_dir="$RUNNER_TEMP/lcow-upstream-inputs"
        base_archive="$inputs_dir/base.tar.gz"
        delta_archive="$inputs_dir/delta.tar.gz"
        kernel_path="$inputs_dir/kernel"

        bash "$GITHUB_WORKSPACE/.github/scripts/construct-lcow-uvm.sh" \
          --mkuvm-path "${{ steps.resolve-mkuvm.outputs.path }}" \
          --output-dir "$output_dir" \
          --archive-path "$archive_path" \
          --base-archive "$base_archive" \
          --delta-archive "$delta_archive" \
          --kernel-path "$kernel_path" \
          --arch "$LCOW_ARCH" \
          --working-directory "$working_dir"

    - name: Upload LCOW UVM bundle directory
      uses: actions/upload-artifact@v4
      with:
        name: lcow-uvm-bundle-amd64
        path: ${{ steps.construct.outputs.output_dir }}
        if-no-files-found: error

    - name: Upload LCOW UVM archive
      uses: actions/upload-artifact@v4
      with:
        name: lcow-uvm-archive-amd64
        path: ${{ steps.construct.outputs.archive_path }}
        if-no-files-found: error